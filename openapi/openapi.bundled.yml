    auction-market-item-detail-response:
      type: object
      required:
        - item
        - listingKey
        - rollupListing
        - regionalMetricsRedundant
        - marketDataSources
        - selectedRealm
        - commodity
        - summary
        - dailySeriesRealm
        - dailySeriesCommodity
        - hourlySeriesRealm
        - hourlySeriesCommodity
        - quantityPieRealm
        - quantityPieCommodity
        - currentListings
        - craftings
        - craftedByRecipeCount
        - reagentInRecipeCount
      properties:
        item:
          $ref: '#/components/schemas/auction-market-item'
        listingKey:
          $ref: '#/components/schemas/auction-listing-key'
          description: Effective listing key used for all queries (defaults applied when query omitted).
        rollupListing:
          type: boolean
          description: True when bonus/modifier/pet defaults mean item-wide rollup (no explicit variant in request).
        regionalMetricsRedundant:
          type: boolean
        marketDataSources:
          type: array
          items:
            $ref: '#/components/schemas/market-data-source'
        selectedRealm:
          $ref: '#/components/schemas/auction-market-metrics'
        commodity:
          $ref: '#/components/schemas/auction-market-metrics'
        summary:
          $ref: '#/components/schemas/auction-market-item-detail-summary'
        dailySeriesRealm:
          type: array
          items:
            $ref: '#/components/schemas/auction-market-item-detail-point'
        dailySeriesCommodity:
          type: array
          items:
            $ref: '#/components/schemas/auction-market-item-detail-point'
        hourlySeriesRealm:
          type: array
          items:
            $ref: '#/components/schemas/auction-market-item-hourly-point'
        hourlySeriesCommodity:
          type: array
          items:
            $ref: '#/components/schemas/auction-market-item-hourly-point'
        quantityPieRealm:
          type: array
          items:
            $ref: '#/components/schemas/auction-market-quantity-pie-slice'
        quantityPieCommodity:
          type: array
          items:
            $ref: '#/components/schemas/auction-market-quantity-pie-slice'
        currentListings:
          type: array
          items:
            $ref: '#/components/schemas/auction-market-item-current-listing'
        crafting:
          $ref: '#/components/schemas/auction-market-item-crafting'
          nullable: true
          deprecated: true
        craftings:
          type: array
          items:
            $ref: '#/components/schemas/auction-market-item-crafting-detail'
        saleRate:
          type: number
          format: double
          nullable: true
          description: |
            TSM regional sale rate for this item in the request region, as a fraction in [0, 1]
            (e.g. 0.25 means 25%). Null when no TSM metric row exists for the region/item.
        soldPerDay:
          type: number
          format: double
          nullable: true
          description: |
            TSM regional average units sold per day for this item in the request region.
            Null when no TSM metric row exists for the region/item.
        craftedByRecipeCount:
          type: integer
          minimum: 0
          description: Number of distinct recipes that craft this item as an output.
        reagentInRecipeCount:
          type: integer
          minimum: 0
          description: Number of distinct recipes that list this item as a reagent (base or ranked).
    auction-market-item-crafting-analytics-point:
      type: object
