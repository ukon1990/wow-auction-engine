    crafting-profile-candidate:
      type: object
      required:
        - characterId
        - characterName
        - region
        - realmName
        - professionId
        - allocationCount
      properties:
        characterId:
          type: integer
          format: int64
        characterName:
          type: string
        region:
          type: string
        realmName:
          type: string
        professionId:
          type: integer
          format: int32
        skillLevel:
          type: integer
          format: int32
          nullable: true
        allocationCount:
          type: integer
          format: int32
          description: Number of configured skill-tree entries. Used as a tie-breaker after predicted output quality.
        predictedQuality:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: Highest output quality tier predicted from saved allocations and imported recipe rules.
    crafting-profile-fit:
      type: object
      required:
        - state
        - craftable
        - diagnostic
        - alternatives
      description: |
        Personal crafting context for the authenticated caller only. When imported recipe rules and talent
        effects exist, craftable and predicted output quality are computed from saved profile allocations.
      properties:
        state:
          type: string
          enum:
            - configured
            - default
        craftable:
          type: boolean
          nullable: true
          description: Null when the imported recipe data has no requirement or talent-effect rules.
        diagnostic:
          type: string
          enum:
            - anonymous_default
            - no_matching_profile_default
            - recipe_rules_unavailable_heuristic_ranking
            - recipe_rules_missing
            - talent_effects_missing
            - profile_evaluated
        bestCandidate:
          allOf:
            - $ref: '#/components/schemas/crafting-profile-candidate'
          nullable: true
        alternatives:
          type: array
          description: Other matching user-owned candidates in deterministic heuristic order.
          items:
            $ref: '#/components/schemas/crafting-profile-candidate'
    crafting-market-search-row:
      type: object
      required:
        - rowId
        - recipeId
        - listingKey
        - craftedQuantity
        - reagentsFullyPriced
        - outputPriced
      properties:
        rowId:
          type: string
          description: Stable id for table rows (recipe + listing variant).
        recipeId:
          type: integer
          format: int32
        recipe:
          $ref: '#/components/schemas/auction-market-recipe'
        item:
          $ref: '#/components/schemas/auction-market-item'
        listingKey:
          $ref: '#/components/schemas/auction-listing-key'
        professionId:
          type: integer
          format: int32
          nullable: true
          description: |
            Profession id for the recipe, taken from `profession.id` via
            `profession_category` and `skill_tier`. Nullable because recipes can be
            orphaned from their profession metadata when reference data sync is in
            progress, in which case the row is still surfaced with a null profession.
        professionName:
          type: string
          nullable: true
          description: Localized profession name. Nullable for the same reason as `professionId`.
        skillTierName:
          type: string
          nullable: true
        professionCategoryName:
          type: string
          nullable: true
        craftedQuantity:
          type: integer
          format: int32
        listingQuantity:
          type: integer
          format: int64
          nullable: true
          description: Quantity at the snapshot for this crafted listing bucket.
        reagentCostCopper:
          type: integer
          format: int64
          nullable: true
        outputPriceCopper:
          type: integer
          format: int64
          nullable: true
          description: Unit buyout for this listing variant at the snapshot hour.
        outputP25PriceCopper:
          type: integer
          format: int64
          nullable: true
          description: 25th percentile buyout for this listing variant at the current snapshot.
        outputP75PriceCopper:
          type: integer
          format: int64
          nullable: true
          description: 75th percentile buyout for this listing variant at the current snapshot.
        profitCopper:
          type: integer
          format: int64
          nullable: true
        roiPercent:
          type: number
          format: double
          nullable: true
        outputPriceChangePercent:
          type: number
          format: double
          nullable: true
          description: vs prior calendar day same hour for this variant.
        profitChangePercent:
          type: number
          format: double
          nullable: true
        reagentsFullyPriced:
          type: boolean
        outputPriced:
          type: boolean
        profileFit:
          allOf:
            - $ref: '#/components/schemas/crafting-profile-fit'
          nullable: true
          description: Present only when the request has an authenticated user. It never exposes another user's profiles.
        saleRate:
          type: number
          format: double
          nullable: true
          description: |
            TSM regional sale rate for the crafted item in the request region, as a fraction in [0, 1]
            (e.g. 0.25 means 25%). Null when no TSM metric row exists for the region/item.
        soldPerDay:
          type: number
          format: double
          nullable: true
          description: |
            TSM regional average units sold per day for the crafted item in the request region.
            Null when no TSM metric row exists for the region/item.
