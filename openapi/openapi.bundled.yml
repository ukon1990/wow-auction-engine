        '400':
          description: Invalid ranks or unmet prerequisites.
        '401':
          description: Authentication required.
        '404':
          description: Character is missing or not owned by the caller.
    delete:
      tags:
        - Profile
      operationId: deleteProfessionProfile
      summary: Delete a character profession allocation
      parameters:
        - $ref: '#/components/parameters/CharacterId'
        - $ref: '#/components/parameters/ProfessionId'
      responses:
        '204':
          description: Deleted.
        '401':
          description: Authentication required.
        '404':
          description: Character is missing or not owned by the caller.
components:
  parameters:
    CorrelationId:
      $ref: '#/components/parameters/correlation-id'
    ClientSessionId:
      $ref: '#/components/parameters/client-session-id'
    CharacterId:
      name: characterId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProfessionId:
      name: professionId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    correlation-id:
      name: X-Correlation-ID
      in: header
      required: false
      description: Canonical UUID used to correlate one request across the frontend, BFF, backend, and downstream services. A missing or invalid value is replaced.
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      example: 0198c728-8f4b-7ccb-9953-d23cc1976587
    client-session-id:
      name: X-Client-Session-ID
      in: header
      required: false
      description: Canonical UUID identifying one browser tab session for observability. The value is optional, is never generated by the backend, and is not an authentication or authorization credential.
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      example: 0198c728-a27c-7286-a24e-230ea6be5045
  headers:
    CorrelationId:
      $ref: '#/components/headers/correlation-id'
    ClientSessionId:
      $ref: '#/components/headers/client-session-id'
    correlation-id:
      description: Canonical UUID used to correlate this request across services. The backend echoes an accepted request value or returns the replacement it generated.
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      example: 0198c728-8f4b-7ccb-9953-d23cc1976587
    client-session-id:
      description: Accepted browser-tab session UUID echoed for observability. Omitted when the request did not contain a valid X-Client-Session-ID value.
      required: false
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      example: 0198c728-a27c-7286-a24e-230ea6be5045
  schemas:
    User:
      $ref: '#/components/schemas/user'
    AdminAuctionHousePage:
      $ref: '#/components/schemas/auction-house-page'
