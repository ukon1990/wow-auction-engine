openapi: 3.0.3
info:
  title: WoW Auction Engine API
  version: 0.0.1
  description: Public API for WoW Auction Engine. Every operation accepts an optional X-Correlation-ID and X-Client-Session-ID request header. Responses always include X-Correlation-ID and include X-Client-Session-ID when the supplied session identifier was accepted. Both identifiers use canonical UUID text; the client-session identifier is observability metadata, not authentication.
servers:
  - url: /api
    description: Same origin
  - url: http://localhost:8080/api
    description: Local backend (direct)
tags:
  - name: Health
    description: Runtime health endpoints.
  - name: Admin
    description: Endpoints for administrating users and data.
  - name: Realm
    description: Realm catalog and per-realm auction house status.
  - name: AuctionMarket
    description: Auction market search and filter metadata.
  - name: CraftingMarket
    description: Crafting market search and filter metadata.
  - name: Profile
    description: Authenticated character profession profiles.
paths:
  /health:
    get:
      tags:
        - Health
      operationId: health
      summary: Check runtime health
      description: Returns no content when the service is healthy, or a bare 503 when runtime health checks fail.
      responses:
        '204':
          description: The application is healthy.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/correlation-id'
            X-Client-Session-ID:
              $ref: '#/components/headers/client-session-id'
        '503':
          description: The application is running but unhealthy.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/correlation-id'
            X-Client-Session-ID:
              $ref: '#/components/headers/client-session-id'
  /admin/auction-houses:
    get:
      tags:
        - AdminAuctionHouse
      operationId: searchAuctionHouses
      summary: Lists all auction houses
      description: Allows an administrator to get an overview over the current status of all the auction houses
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: sortBy
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/auction-house-page-sort-by'
            default: name
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            default: asc
            enum:
              - asc
              - desc
      responses:
        '200':
          description: A list of all the auction houses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auction-house-page'
  /admin/auction-houses/{id}:
    get:
      tags:
        - AdminAuctionHouse
      operationId: getAuctionHouseById
      summary: Get information about an auction house's status by id
      description: Allows an administrator to gets a spesific auction houses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: A gets a spesific auction house
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auction-house'
        '404':
          description: There is no auction house with this id
  /admin/users:
    get:
      tags:
        - Admin
      operationId: listUsers
      summary: Lists all registered users and their current status
      description: Allows an administrator to review the current users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/user'
  /admin/status:
    get:
      tags:
        - Admin
      operationId: getAdminStatus
      summary: Gets database and server diagnostic metrics
      description: Allows an administrator to review current database and server status.
      responses:
        '200':
          description: Database and server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-status'
  /admin/sql/execute:
    post:
      tags:
        - Admin
      operationId: executeAdminSql
      summary: Executes an admin read-only SQL diagnostic query
      description: Allows an administrator to run read-only SQL diagnostics, explain plans, and confirmed analyze plans.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin-sql-execute-request'
      responses:
        '200':
          description: SQL execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-sql-result'
        '400':
          description: Invalid or blocked SQL
  /admin/sql/metadata:
    get:
      tags:
        - Admin
      operationId: getAdminSqlMetadata
      summary: Gets available SQL tables, columns, and indexes
      description: Allows an administrator to inspect read-only database metadata for the SQL editor.
      responses:
        '200':
          description: SQL metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-sql-metadata'
  /admin/expansions:
    get:
      tags:
        - Admin
      operationId: listExpansions
      summary: Lists configured item expansions
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
          description: Optional locale override for resolved expansion names.
      responses:
        '200':
          description: Expansions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/admin-expansion'
    post:
      tags:
        - Admin
      operationId: createExpansion
      summary: Creates an expansion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin-expansion-request'
      responses:
        '200':
          description: Created expansion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-expansion'
        '400':
          description: Invalid expansion
        '409':
          description: Expansion id, slug, or major version already exists
  /admin/expansions/{id}:
    put:
      tags:
        - Admin
      operationId: updateExpansion
      summary: Updates an expansion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin-expansion-request'
      responses:
        '200':
          description: Updated expansion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-expansion'
        '400':
          description: Invalid expansion
        '404':
          description: Expansion not found
        '409':
          description: Slug or major version already exists
    delete:
      tags:
        - Admin
      operationId: deleteExpansion
      summary: Deletes an expansion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Expansion deleted
        '404':
          description: Expansion not found
        '409':
          description: Expansion is referenced by ranges or items
  /admin/expansion-ranges:
    get:
      tags:
        - Admin
      operationId: listExpansionRanges
      summary: Lists configured item expansion ranges
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
          description: Optional locale override for resolved expansion names.
      responses:
        '200':
          description: Expansion ranges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/admin-expansion-item-range'
    post:
      tags:
        - Admin
      operationId: createExpansionRange
      summary: Creates an item expansion range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin-expansion-item-range-request'
      responses:
        '200':
          description: Created range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-expansion-item-range'
        '400':
          description: Invalid range
  /admin/expansion-ranges/{id}:
    put:
      tags:
        - Admin
      operationId: updateExpansionRange
      summary: Updates an item expansion range
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin-expansion-item-range-request'
      responses:
        '200':
          description: Updated range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-expansion-item-range'
        '400':
          description: Invalid range
        '404':
          description: Range not found
    delete:
      tags:
        - Admin
      operationId: deleteExpansionRange
      summary: Deletes an item expansion range
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Range deleted
        '404':
          description: Range not found
  /admin/expansion-ranges/apply:
    post:
      tags:
        - Admin
      operationId: applyExpansionRanges
      summary: Starts a job that applies enabled expansion ranges to existing items
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-job'
        '409':
          description: A job of this type is already running
  /admin/expansion-ranges/fetch-missing-items:
    post:
      tags:
        - Admin
      operationId: fetchMissingExpansionRangeItems
      summary: Starts a job that fetches missing items covered by enabled expansion ranges
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-job'
        '409':
          description: A job of this type is already running
  /admin/professions/sync:
    post:
      tags:
        - Admin
      operationId: syncProfessionRecipes
      summary: Starts a profession and recipe synchronization job
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-job'
        '409':
          description: A profession and recipe synchronization is already running
  /admin/professions/sync/active:
    get:
      tags:
        - Admin
      operationId: getActiveProfessionSyncJob
      summary: Gets the running profession and recipe synchronization job
      responses:
        '200':
          description: Running profession and recipe synchronization job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-job'
        '404':
          description: No profession and recipe synchronization job is running
  /admin/profession-talent-trees/import:
    post:
      tags:
        - Admin
      operationId: importProfessionTalentTrees
      summary: Replace versioned profession talent tree definitions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/profession-talent-tree-import-request'
      responses:
        '204':
          description: Imported.
        '400':
          description: Unsupported or malformed versioned talent export.
        '403':
          description: Administrator role required.
  /admin/profession-talent-trees/inspect-normalized:
    post:
      tags:
        - Admin
      operationId: inspectNormalizedAuctionHelperProfessionData
      summary: Import locally normalized AuctionHelper profession data
      description: Accepts bounded, versioned JSON produced by the browser-side Lua processors. Raw Lua and encoded addon payloads are never accepted. The endpoint validates recipe, item, reagent, skill, and talent associations and stores an idempotent normalized snapshot. Incomplete addon associations are reported as diagnostics rather than rejecting otherwise safe data. Requests are limited to 32 MiB before JSON deserialization and receive an X-Correlation-ID header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/normalized-auction-helper-profession-data'
      responses:
        '200':
          description: Normalized data inspection result returned after persistence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/normalized-auction-helper-profession-inspection'
        '400':
          description: Unsupported contract version or structurally invalid normalized data.
        '403':
          description: Administrator role required.
        '413':
          description: Normalized JSON request exceeds 32 MiB.
  /admin/jobs/{id}:
    get:
      tags:
        - Admin
      operationId: getAdminJob
      summary: Gets an admin job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Admin job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-job'
        '404':
          description: Job not found
  /admin/items:
    get:
      tags:
        - Admin
      operationId: searchAdminItems
      summary: Searches effective item rows for admin editing
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Optional search text matched against item id and localized names.
        - name: locale
          in: query
          required: false
          schema:
            type: string
          description: Optional locale override for resolved labels.
        - name: hasBase
          in: query
          required: false
          schema:
            type: boolean
          description: Filter to items with or without a Blizzard/base row.
        - name: hasOverride
          in: query
          required: false
          schema:
            type: boolean
          description: Filter to items with or without an admin override row.
        - name: itemClassId
          in: query
          required: false
          schema:
            type: integer
          description: Filter to an item class id.
        - name: itemSubclassId
          in: query
          required: false
          schema:
            type: integer
          description: Filter to an item subclass id within the selected/effective class.
        - name: expansionId
          in: query
          required: false
          schema:
            type: integer
          description: Filter to an expansion id.
        - name: hasRecipe
          in: query
          required: false
          schema:
            type: boolean
          description: Filter to items with or without an associated crafting recipe.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Paginated admin items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-item-page'
        '400':
          description: Invalid search or pagination request
    post:
      tags:
        - Admin
      operationId: createAdminItem
      summary: Creates an override-only manual item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin-item-create-request'
      responses:
        '200':
          description: Created admin item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-item'
        '400':
          description: Invalid item
        '409':
          description: Item already has a base or override row
  /admin/items/{id}:
    get:
      tags:
        - Admin
      operationId: getAdminItem
      summary: Gets an effective admin item row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: locale
          in: query
          required: false
          schema:
            type: string
          description: Optional locale override for resolved labels.
        - name: includeBase
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include raw Blizzard/base row fields when present.
        - name: includeOverride
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include raw sparse override row fields when present.
      responses:
        '200':
          description: Admin item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-item'
        '404':
          description: Item not found
  /admin/items/{id}/override:
    put:
      tags:
        - Admin
      operationId: upsertAdminItemOverride
      summary: Upserts a sparse admin override for an existing item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin-item-override-request'
      responses:
        '200':
          description: Updated admin item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-item'
        '400':
          description: Invalid override
        '404':
          description: Base item not found
    delete:
      tags:
        - Admin
      operationId: deleteAdminItemOverride
      summary: Deletes the sparse admin override row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Override deleted
        '404':
          description: Override not found
  /admin/items/{id}/recipes/{recipeId}:
    put:
      tags:
        - Admin
      operationId: upsertAdminItemRecipeAssociation
      summary: Associates a recipe with an item by updating recipe crafted output fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: recipeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin-recipe-association-request'
      responses:
        '200':
          description: Updated admin item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-item'
        '400':
          description: Invalid recipe association
        '404':
          description: Item or recipe not found
  /admin/items/{id}/compare-api:
    post:
      tags:
        - Admin
      operationId: compareAdminItemWithApi
      summary: Fetches the Blizzard API item and compares it to base, override, and effective fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item API comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-item-compare-response'
        '404':
          description: Item not found locally or in Blizzard API
  /admin/items/bulk-overrides:
    put:
      tags:
        - Admin
      operationId: bulkUpsertAdminItemOverrides
      summary: Upserts sparse admin overrides in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin-item-bulk-override-request'
      responses:
        '200':
          description: Updated admin items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/admin-item'
        '400':
          description: Invalid bulk override request
        '404':
          description: One or more base items were not found
  /admin/recipes:
    get:
      tags:
        - Admin
      operationId: searchAdminRecipes
      summary: Searches effective recipe rows for admin editing
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Optional search text matched against recipe id and localized recipe names.
        - name: locale
          in: query
          required: false
          schema:
            type: string
          description: Optional locale override for resolved labels.
        - name: professionId
          in: query
          required: false
          schema:
            type: integer
          description: Filter to a profession id.
        - name: hasOverride
          in: query
          required: false
          schema:
            type: boolean
          description: Filter to recipes with or without an admin override row.
        - name: itemClassId
          in: query
          required: false
          schema:
            type: integer
          description: Filter by the class of an associated crafted output or reagent.
        - name: itemSubclassId
          in: query
          required: false
          schema:
            type: integer
          description: Filter by the subclass of an associated crafted output or reagent.
        - name: expansionId
          in: query
          required: false
          schema:
            type: integer
          description: Filter by the expansion of an associated crafted output or reagent.
        - name: associatedItemId
          in: query
          required: false
          schema:
            type: integer
          description: Filter to recipes associated with this item as an output or reagent.
        - name: associationType
          in: query
          required: false
          schema:
            type: string
            enum:
              - crafted
              - reagent
          description: Restrict associated item filters to crafted outputs or reagents; omit for either.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Paginated admin recipes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-recipe-page'
        '400':
          description: Invalid search request
  /admin/recipes/{id}:
    get:
      tags:
        - Admin
      operationId: getAdminRecipe
      summary: Gets an effective admin recipe row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: locale
          in: query
          required: false
          schema:
            type: string
        - name: includeBase
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeOverride
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Admin recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-recipe'
        '404':
          description: Recipe not found
  /admin/recipes/{id}/override:
    put:
      tags:
        - Admin
      operationId: upsertAdminRecipeOverride
      summary: Upserts sparse scalar and optional collection overrides for an existing recipe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin-recipe-override-request'
      responses:
        '200':
          description: Updated admin recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-recipe'
        '400':
          description: Invalid override
        '404':
          description: Base recipe not found
    delete:
      tags:
        - Admin
      operationId: deleteAdminRecipeOverride
      summary: Deletes all admin overrides for the recipe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Override deleted
        '404':
          description: Override not found
  /admin/recipes/{id}/compare-api:
    post:
      tags:
        - Admin
      operationId: compareAdminRecipeWithApi
      summary: Fetches the Blizzard API recipe and compares it to base, override, and effective fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Recipe API comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin-recipe-compare-response'
        '404':
          description: Recipe not found locally or in Blizzard API
  /admin/recipes/bulk-overrides:
    put:
      tags:
        - Admin
      operationId: bulkUpsertAdminRecipeOverrides
      summary: Upserts sparse admin recipe overrides in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin-recipe-bulk-override-request'
      responses:
        '200':
          description: Updated admin recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/admin-recipe'
        '400':
          description: Invalid bulk override request
        '404':
          description: One or more base recipes were not found
  /realms:
    get:
      tags:
        - Realm
      operationId: listRealms
      summary: List all known realms across configured regions
      description: Returns a flat list with one entry per individual realm.
      responses:
        '200':
          description: Flat list of realms (one entry per individual realm).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/realm'
  /realms/{region}/{slug}:
    get:
      tags:
        - Realm
      operationId: getRealm
      summary: Get a single realm with its connected-realm and commodity auction-house status
      parameters:
        - name: region
          in: path
          required: true
          schema:
            type: string
            enum:
              - us
              - eu
              - kr
              - tw
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Realm detail including the parent connected realm's auction house status and the regional commodity auction house status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/realm-detail'
        '404':
          description: No realm exists for the given region and slug, or the regional commodity placeholder has not been seeded yet.
  /auctions/search:
    get:
      tags:
        - AuctionMarket
      operationId: search
