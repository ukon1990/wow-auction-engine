name: Set up backend Java
description: Install the Temurin 25 release pinned in backend/.sdkmanrc and verify it.

runs:
  using: composite
  steps:
    - name: Set up Temurin
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        # Adoptium semver for Temurin 25.0.4.1+1; keep in sync with backend/.sdkmanrc and backend/Dockerfile.
        java-version: "25.0.4+101.0.LTS"
        cache: maven
        cache-dependency-path: backend/pom.xml

    - name: Verify Java runtime
      shell: bash
      run: ./scripts/ci/check-java-runtime.sh
