<header
  class="sticky top-0 z-50 flex h-16 w-full items-center justify-between gap-3 border-b border-white/10 bg-surface-container-lowest/95 px-4 shadow-[0_4px_20px_rgba(0,0,0,0.45)] backdrop-blur-xl md:gap-6 md:px-6"
>
  <div class="flex min-w-0 items-center gap-4 lg:gap-8">
    <a
      class="hidden shrink-0 font-cinzel text-lg font-bold tracking-[0.04em] text-primary-container md:block lg:text-xl"
      [routerLink]="homeRouterLink()"
    >
      <ng-container i18n="@@brand.name">The Ethereal Exchange</ng-container>
    </a>
    <nav
      class="hidden min-w-0 items-center gap-1 md:flex lg:gap-2"
      aria-label="Primary navigation"
      i18n-aria-label="@@topNav.primaryNavigation"
    >
      @for (item of items(); track item.id) {
        <ee-top-nav-item [item]="item" />
      }
    </nav>
    <div class="flex min-w-0 items-center md:hidden">
      <ng-content select="[eeTopNavStart]" />
    </div>
  </div>
  <div class="flex min-w-0 shrink-0 items-center gap-2 md:gap-3">
    <div class="hidden min-w-0 items-center md:flex">
      <ng-content select="[eeTopNavStartDesktop]" />
    </div>
    <ng-content />
    <label class="sr-only" for="ee-locale-select" i18n="@@topNav.language">Language</label>
    <select
      id="ee-locale-select"
      class="h-10 rounded-md border border-white/10 bg-surface-container px-2 text-sm text-on-surface transition hover:bg-surface-container-high"
      [value]="activeLocale()"
      (change)="onLocaleChange($event)"
    >
      @for (locale of localeOptions(); track locale.id) {
        <option [value]="locale.id" [selected]="locale.id === activeLocale()">
          {{ locale.label }}
        </option>
      }
    </select>
    <a
      class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-full border-2 border-primary bg-surface-container text-primary transition hover:bg-surface-container-high md:inline-flex"
      [routerLink]="accountRouterLink()"
      [queryParams]="accountQueryParams()"
      [attr.aria-label]="accountLabel()"
      [attr.title]="accountLabel()"
    >
      <ee-symbol-icon class="text-[20px]" name="person" />
    </a>
  </div>
</header>
