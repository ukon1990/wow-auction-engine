<div class="flex min-h-0 flex-1 overflow-hidden">
  <ee-filter-panel
    (optionSelected)="onFilterSelected($event)"
    (optionToggled)="onFilterToggled($event)"
    (rangeChanged)="onRangeChanged($event)"
    (reset)="onFiltersReset()"
    [sections]="filterSections()"
    class="hidden lg:flex"
    panelClass="flex w-64 shrink-0 flex-col overflow-hidden border-r border-white/10 bg-surface-container-lowest"
  />
  <ee-page-frame [title]="pageTitle()" [description]="pageDescription()" bodyLayout="fill">
    <div class="flex flex-col gap-3">
      <div class="flex items-center gap-2">
        <ee-search-input [formControl]="searchField" class="min-w-0 flex-1" />
        <button
          eeButton
          (click)="openMobileFilters()"
          [attr.aria-expanded]="mobileFiltersOpen()"
          aria-haspopup="dialog"
          class="lg:hidden"
          type="button"
        >
          <ee-symbol-icon aria-hidden="true" class="text-base" name="filter_alt" />
          <ng-container i18n="@@filters.titleShort">Filters</ng-container>
          @if (activeFilterChips().length; as count) {
            <span
              class="rounded-full bg-primary px-1.5 text-xs font-bold leading-5 text-on-primary"
              >{{ count }}</span
            >
          }
        </button>
      </div>
      <ee-active-filter-chips
        [chips]="activeFilterChips()"
        label="Active filters"
        i18n-label="@@filters.active"
        removeLabel="Remove filter"
        i18n-removeLabel="@@filters.remove"
        (removed)="onChipRemoved($event)"
        (clearAll)="onFiltersReset()"
      >
        @if (resultSummary(); as summary) {
          {{ summary }}
        }
      </ee-active-filter-chips>
    </div>
    <div class="flex min-h-0 min-w-0 flex-1 overflow-hidden">
      <ee-table
        (pageChange)="onPageChange($event)"
        (sortingChange)="onTableSortingChange($event)"
        [bodyRowClassFn]="marketRowClass"
        [cardView]="cardView()"
        [clickableRows]="false"
        [columns]="marketTableColumns()"
        [contentMinWidthClass]="marketTableMinWidth"
        [data]="currentRows()"
        [emptyPaginationSummary]="emptyPaginationSummary"
        [getRowId]="marketRowId"
        [headerRowClass]="marketTableHeaderRow"
        [loading]="isLoading()"
        [loadingPaginationSummary]="loadingPaginationSummary"
        [manualSorting]="true"
        [mobileSortOptions]="marketMobileSortOptions"
        [paginationState]="paginationState()"
        [rowGridTemplateColumns]="marketRowGridTemplate()"
        [showFooter]="true"
        [showPagination]="true"
        [skeletonRowClass]="marketSkeletonRowClass"
        [skeletonRowCount]="pageSize()"
        [sorting]="marketTableSorting()"
        emptyMessage="No items match these filters."
        i18n-emptyMessage="@@market.pagination.empty"
        i18n-sectionAriaLabel="@@market.table.aria"
        sectionAriaLabel="Market items"
      />
    </div>
    <div
      [attr.aria-hidden]="!mobileFiltersOpen()"
      [attr.aria-label]="mobileFiltersOpen() ? filterOptionsLabel() : null"
      [attr.aria-modal]="mobileFiltersOpen() ? 'true' : null"
      [attr.inert]="mobileFiltersOpen() ? null : ''"
      [attr.role]="mobileFiltersOpen() ? 'dialog' : null"
      [class.opacity-0]="!mobileFiltersOpen()"
      [class.opacity-100]="mobileFiltersOpen()"
      [class.pointer-events-none]="!mobileFiltersOpen()"
      class="fixed inset-0 z-50 flex transition-opacity duration-300 lg:hidden"
    >
      <button
        (click)="closeMobileFilters()"
        aria-label="Close filters"
        class="flex-1 bg-black/60 transition-opacity duration-300"
        i18n-aria-label="@@filters.close"
        type="button"
      ></button>
      <div
        [class.translate-x-0]="mobileFiltersOpen()"
        [class.translate-x-full]="!mobileFiltersOpen()"
        class="flex h-full min-h-0 w-[min(22rem,90vw)] flex-col overflow-hidden border-l border-white/10 bg-surface-container-lowest p-3 transition-transform duration-300 ease-out"
      >
        <div class="mb-3 flex items-center justify-between gap-2">
          <span></span>
          <button eeButton size="sm" (click)="closeMobileFilters()" type="button">
            <ng-container i18n="@@common.close">Close</ng-container>
          </button>
        </div>
        <ee-filter-panel
          (optionSelected)="onFilterSelected($event)"
          (optionToggled)="onFilterToggled($event)"
          (rangeChanged)="onRangeChanged($event)"
          (reset)="onFiltersReset(); closeMobileFilters()"
          [sections]="filterSections()"
          class="flex min-h-0 flex-1"
          panelClass="flex min-h-0 w-full flex-1 flex-col overflow-hidden"
        />
      </div>
    </div>
  </ee-page-frame>
</div>
